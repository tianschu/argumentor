# Builds the static site and publishes it to GitHub Pages on every push to main.
#
# The published site contains NO API key: build-site.mjs copies only browser-safe modules and refuses to
# build if any of them looks like it contains one. server.mjs, provider.mjs, env.mjs and setup.mjs — the
# only key-aware files — are never copied into site/.
#
# To point the site at a hosted back end instead of offline mode, set a repository *variable* named
# ARGUMENTOR_API (Settings → Secrets and variables → Actions → Variables) to your Worker URL.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the test suite
        run: npm test
      - name: Build the static site
        run: |
          if [ -n "${{ vars.ARGUMENTOR_API }}" ]; then
            node build-site.mjs --api "${{ vars.ARGUMENTOR_API }}"
          else
            node build-site.mjs
          fi
      - name: Fail if anything key-shaped reached the build
        run: |
          if grep -rEl 'sk-[A-Za-z0-9]{20,}' site/ ; then
            echo "A file in site/ looks like it contains an API key. Refusing to publish."
            exit 1
          fi
          echo "No key found in site/."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
